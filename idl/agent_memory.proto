syntax = "proto3";

package agent_memory;

option go_package = "github.com/MoScenix/agent-memory/app/agent_memory/hertz_gen/agent_memory";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "api.proto";

// AgentMemoryService is the public HTTP/JSON contract. Writes to an existing
// graph require the expected version.
// For POST methods, the JSON payload is the nested Body message itself.
service AgentMemoryService {
  rpc Health(google.protobuf.Empty) returns (HealthResponse) {
    option (api.get) = "/healthz";
  }

  rpc CreateGraph(CreateGraphRequest) returns (CreateGraphResponse) {
    option (api.post) = "/graphs";
  }

  rpc GetGraph(GetGraphRequest) returns (GetGraphResponse) {
    option (api.get) = "/graphs/:graph_id";
  }

  rpc AddFact(AddFactRequest) returns (AddFactResponse) {
    option (api.post) = "/graphs/:graph_id/facts";
  }

  rpc ChangeFact(ChangeFactRequest) returns (ChangeFactResponse) {
    option (api.post) = "/graphs/:graph_id/fact-changes";
  }

  rpc GetNode(GetNodeRequest) returns (GetNodeResponse) {
    option (api.get) = "/graphs/:graph_id/nodes/:node_id";
  }

  rpc EvaluateNode(EvaluateNodeRequest) returns (EvaluateNodeResponse) {
    option (api.post) = "/graphs/:graph_id/nodes/:node_id/evaluations";
  }

  rpc TraceRelations(TraceRelationsRequest) returns (TraceRelationsResponse) {
    option (api.post) = "/graphs/:graph_id/relations:trace";
  }

  rpc SearchFacts(SearchFactsRequest) returns (SearchFactsResponse) {
    option (api.post) = "/graphs/:graph_id/facts:search";
  }

  rpc GetSyncEvent(GetSyncEventRequest) returns (GetSyncEventResponse) {
    option (api.get) = "/sync-events/:event_id";
  }

  rpc ListSyncEventsByChange(ListSyncEventsByChangeRequest) returns (ListSyncEventsByChangeResponse) {
    option (api.get) = "/changes/:change_id/sync-events";
  }
}

message HealthResponse {
  string status = 1;
}

message Graph {
  string graph_id = 1;
  string user_id = 2;
  uint64 version = 3;
}

message CreateGraphRequest {
  message Body {
    string user_id = 1;
    string idempotency_key = 2;
  }

  Body body = 1;
}

message CreateGraphResponse {
  Graph graph = 1;
}

message GetGraphRequest {
  string graph_id = 1 [(api.path) = "graph_id"];
  string user_id = 2 [(api.query) = "user_id"];
}

message GetGraphResponse {
  Graph graph = 1;
}

enum RelationType {
  RELATION_TYPE_UNSPECIFIED = 0;
  RELATION_TYPE_CORRECTION = 1;
  RELATION_TYPE_UPDATE = 2;
}

message FactInput {
  string content = 1;
  double confidence = 2;
  optional google.protobuf.Timestamp valid_from = 3;
  optional google.protobuf.Timestamp expires_at = 4;
  string reason = 5;
}

message Node {
  string node_id = 1;
  string graph_id = 2;
  string content = 3;
  double confidence = 4;
  bool is_valid = 5;
  optional google.protobuf.Timestamp valid_from = 6;
  optional google.protobuf.Timestamp fix_time = 7;
  optional google.protobuf.Timestamp expires_at = 8;
  string latest_evaluation_id = 9;
  uint64 version = 10;
}

message Evaluation {
  reserved 5, 6, 9 to 16;
  reserved "action", "confidence_before", "confidence_after", "change_id", "graph_version",
      "is_valid_before", "is_valid_after", "fix_time_before", "fix_time_after",
      "expires_at_before", "expires_at_after";

  string evaluation_id = 1;
  string node_id = 2;
  string graph_id = 3;
  optional string previous_evaluation_id = 4;
  double confidence = 7;
  string reason = 8;
  uint64 node_version = 17;
  google.protobuf.Timestamp evaluated_at = 18;
}

message Edge {
  string edge_id = 1;
  string graph_id = 2;
  // The new node that changed the previous node.
  string from_node_id = 3;
  // The previous node referenced by the new node.
  string to_node_id = 4;
  RelationType relation_type = 5;
  string reason = 6;
  string change_id = 7;
  uint64 graph_version = 8;
}

enum OutboxEventType {
  OUTBOX_EVENT_TYPE_UNSPECIFIED = 0;
  OUTBOX_EVENT_TYPE_ADD = 1;
  OUTBOX_EVENT_TYPE_UPDATE = 2;
}

enum SyncStatus {
  SYNC_STATUS_UNSPECIFIED = 0;
  SYNC_STATUS_PENDING = 1;
  SYNC_STATUS_PROCESSING = 2;
  SYNC_STATUS_RETRY_WAIT = 3;
  SYNC_STATUS_SUCCEEDED = 4;
  SYNC_STATUS_FAILED = 5;
}

message SyncEvent {
  string event_id = 1;
  string graph_id = 2;
  string change_id = 3;
  OutboxEventType event_type = 4;
  SyncStatus status = 5;
  uint32 attempts = 6;
  optional google.protobuf.Timestamp next_attempt_at = 7;
  optional google.protobuf.Timestamp lease_until = 8;
  optional string last_error = 9;
}

message AddFactRequest {
  message Body {
    reserved 3;
    reserved "idempotency_key";

    string user_id = 1;
    uint64 expected_graph_version = 2;
    FactInput fact = 4;
  }

  string graph_id = 1 [(api.path) = "graph_id"];
  Body body = 2;
}

message AddFactResponse {
  Node node = 1;
  Evaluation initial_evaluation = 2;
  uint64 graph_version = 3;
  SyncEvent sync_event = 4;
}

message PreviousNodeChange {
  string node_id = 1;
  uint64 expected_node_version = 2;
  RelationType relation_type = 3;
  string reason = 4;

  // Required for CORRECTION and must be lower than the current confidence.
  optional double corrected_confidence = 5;

  // Required for UPDATE; it is the time the old fact stopped being true.
  optional google.protobuf.Timestamp fix_time = 6;
}

message ChangeFactRequest {
  message Body {
    reserved 3;
    reserved "idempotency_key";

    string user_id = 1;
    uint64 expected_graph_version = 2;
    FactInput new_fact = 4;
    repeated PreviousNodeChange previous_nodes = 5;
  }

  string graph_id = 1 [(api.path) = "graph_id"];
  Body body = 2;
}

message ChangedPreviousNode {
  Node node = 1;
  Evaluation evaluation = 2;
  Edge edge = 3;
}

message ChangeFactResponse {
  string change_id = 1;
  Node new_node = 2;
  Evaluation initial_evaluation = 3;
  repeated ChangedPreviousNode previous_nodes = 4;
  uint64 graph_version = 5;
  SyncEvent sync_event = 6;
}

message GetNodeRequest {
  string graph_id = 1 [(api.path) = "graph_id"];
  string node_id = 2 [(api.path) = "node_id"];
  string user_id = 3 [(api.query) = "user_id"];
  uint32 evaluation_limit = 4 [(api.query) = "evaluation_limit"];
  optional string evaluation_before_id = 5 [(api.query) = "evaluation_before_id"];
}

message GetNodeResponse {
  Node node = 1;
  repeated Evaluation evaluations = 2;
  optional string next_evaluation_before_id = 3;
}

message EvaluateNodeRequest {
  message Body {
    reserved 4;
    reserved "idempotency_key";

    string user_id = 1;
    uint64 expected_graph_version = 2;
    uint64 expected_node_version = 3;
    double confidence = 5;
    string reason = 6;
  }

  string graph_id = 1 [(api.path) = "graph_id"];
  string node_id = 2 [(api.path) = "node_id"];
  Body body = 3;
}

message EvaluateNodeResponse {
  Node node = 1;
  Evaluation evaluation = 2;
  uint64 graph_version = 3;
}

message TraceRelationsRequest {
  message Body {
    string user_id = 1;
    repeated string node_ids = 2;
    uint32 limit = 3;

    oneof stop_condition {
      // Inclusive past bound of the trace window.
      google.protobuf.Timestamp end_time = 4;
      uint32 max_depth = 5;
    }
    // Shared exclusive upper bound, used with end_time. Defaults to the latest
    // known valid_from among the start nodes, or request time if none is known.
    optional google.protobuf.Timestamp start_time = 6;
  }

  string graph_id = 1 [(api.path) = "graph_id"];
  Body body = 2;
}

message TraceBoundary {
  string node_id = 1;
  uint32 depth = 2;
}

message TraceRelationsResponse {
  uint64 graph_version = 1;
  repeated Node nodes = 2;
  repeated Edge edges = 3;
  bool truncated = 4;
  repeated TraceBoundary unexpanded_boundaries = 5;
}

enum SearchMode {
  SEARCH_MODE_UNSPECIFIED = 0;
  SEARCH_MODE_SEMANTIC = 1;
  SEARCH_MODE_HYBRID = 2;
}

message TimeFilter {
  // A fact must be effective at this business time.
  optional google.protobuf.Timestamp valid_at = 1;
  // A fact's effective interval must overlap this window. Do not set valid_at
  // together with valid_range.
  optional ValidTimeRange valid_range = 2;
}

message ValidTimeRange {
  google.protobuf.Timestamp start = 1;
  // Exclusive upper bound.
  google.protobuf.Timestamp end = 2;
}

message SearchFactsRequest {
  message Body {
    string user_id = 1;
    string question = 2;
    uint32 top_k = 3;
    optional double minimum_confidence = 4;
    optional TimeFilter time_filter = 5;
    SearchMode mode = 6;
  }

  string graph_id = 1 [(api.path) = "graph_id"];
  Body body = 2;
}

message SearchHit {
  Node node = 1;
  double relevance_score = 2;
  uint32 rank = 3;
}

message SearchFactsResponse {
  uint64 graph_version = 1;
  repeated SearchHit hits = 2;
}

message GetSyncEventRequest {
  string event_id = 1 [(api.path) = "event_id"];
  string user_id = 2 [(api.query) = "user_id"];
}

message GetSyncEventResponse {
  SyncEvent sync_event = 1;
}

message ListSyncEventsByChangeRequest {
  string change_id = 1 [(api.path) = "change_id"];
  string user_id = 2 [(api.query) = "user_id"];
}

message ListSyncEventsByChangeResponse {
  repeated SyncEvent sync_events = 1;
}
